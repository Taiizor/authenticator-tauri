name: Build & Release

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- Set version from tag (v1.2.3 → 1.2.3) ---
      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          # Patch tauri.conf.json & package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          # Patch Cargo.toml (cross-platform)
          python3 -c "
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          p.write_text(re.sub(r'^version = \".*\"', 'version = \"$VERSION\"', p.read_text(), count=1, flags=re.M))
          "

      # --- Set dev version (1.0.0 → 1.0.0-dev.14) ---
      - name: Set dev version
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          BASE=$(jq -r '.version' src-tauri/tauri.conf.json)
          VERSION="${BASE}-dev.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          # Patch tauri.conf.json & package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      # --- Stable release (v* tag) ---
      - name: Build & publish release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bunx tauri
          tagName: v${{ env.APP_VERSION }}
          releaseName: "Authenticator v${{ env.APP_VERSION }}"
          releaseBody: "See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # --- Dev release (branch push) ---
      - name: Build & publish dev build
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bunx tauri
          tagName: v${{ env.APP_VERSION }}
          releaseName: "Authenticator v${{ env.APP_VERSION }}"
          releaseBody: |
            **Dev Build #${{ github.run_number }}** from `${{ github.ref_name }}` branch.

            Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            > [!WARNING]
            > This is a development build. For production use, download the [latest stable release](https://github.com/${{ github.repository }}/releases/latest) instead.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
