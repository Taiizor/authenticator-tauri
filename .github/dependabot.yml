version: 2

updates:
  # Frontend (Bun/npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
          - "tauri-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix-ui:
        patterns:
          - "radix-ui"
          - "@radix-ui/*"
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"

  # Backend (Cargo/Rust)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      crypto:
        patterns:
          - "aes-gcm"
          - "argon2"
          - "rand"
          - "zeroize"
      protobuf:
        patterns:
          - "prost"
          - "prost-*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
